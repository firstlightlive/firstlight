<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030608;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:80px;
  background:linear-gradient(180deg,#030608 0%,#080c14 50%,#030608 100%)}
.s::before{content:'';position:absolute;top:-1px;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#00B0FF 25%,#00E676 50%,#FC4C02 75%,transparent);opacity:0.6}
.s::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#FC4C02 25%,#00E676 50%,#00B0FF 75%,transparent);opacity:0.3}
.glow1{position:absolute;top:20%;left:20%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,176,255,0.05) 0%,transparent 60%);filter:blur(40px)}
.glow2{position:absolute;bottom:20%;right:20%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,76,2,0.05) 0%,transparent 60%);filter:blur(40px)}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:8px;color:#FC4C02;
  margin-bottom:48px;padding:8px 20px;border:1px solid rgba(252,76,2,0.25);border-radius:4px;
  background:rgba(252,76,2,0.04)}
.title{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:700;text-align:center;line-height:1.3;
  margin-bottom:60px;
  background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,0.7) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rules{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:3px;line-height:3.2}
.rules .val{font-weight:700;font-size:18px}
.rules .swim-c{color:#00B0FF} .rules .bike-c{color:#00E676} .rules .run-c{color:#FC4C02} .rules .gold-c{color:#F5A623}
.rules .dim{color:rgba(255,255,255,0.3)}
.brand{position:absolute;bottom:50px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:6px;color:rgba(255,255,255,0.1)}
</style></head><body>
<div class="s">
  <div class="glow1"></div><div class="glow2"></div>
  <div class="badge">FROM DAY 111</div>
  <div class="title">HARDER<br>TRAINING.<br>SAME ALARM.</div>
  <div class="rules">
    <span class="val run-c">150 KM</span> <span class="dim">EVERY WEEK</span><br>
    <span class="val gold-c">3:15 AM</span> <span class="dim">EVERY DAY</span><br>
    <span class="val">₹5,000</span> <span class="dim">ON THE LINE</span><br>
    <span class="val swim-c">IRON</span><span class="val bike-c">MAN</span> <span class="dim">IS THE TARGET</span>
  </div>
  <div class="brand">◆ FIRST LIGHT</div>
</div>
</body></html>
