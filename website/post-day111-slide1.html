<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030608;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#030608 0%,#0a0e18 40%,#030608 100%)}
.s::before{content:'';position:absolute;top:30%;left:10%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,176,255,0.08) 0%,transparent 60%);filter:blur(60px)}
.s::after{content:'';position:absolute;bottom:20%;right:10%;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,76,2,0.08) 0%,transparent 60%);filter:blur(60px)}
.glow{position:absolute;top:60%;left:50%;transform:translateX(-50%);width:350px;height:350px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,230,118,0.06) 0%,transparent 60%);filter:blur(50px)}
.ring{position:absolute;width:520px;height:520px;border:1px solid rgba(255,255,255,0.03);border-radius:50%}
.ring2{position:absolute;width:620px;height:620px;border:1px solid rgba(255,255,255,0.02);border-radius:50%;transform:rotate(30deg)}
.label{position:absolute;top:100px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:10px;color:rgba(255,255,255,0.2)}
.day{font-family:'IBM Plex Mono',monospace;font-size:300px;font-weight:700;line-height:0.85;
  background:linear-gradient(180deg,#fff 30%,rgba(252,76,2,0.6) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 80px rgba(252,76,2,0.2))}
.sub{position:absolute;bottom:160px;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:8px;color:rgba(255,255,255,0.25)}
.tri{position:absolute;bottom:100px;display:flex;gap:24px}
.tri span{width:8px;height:8px;border-radius:50%}
.swim{background:#00B0FF;box-shadow:0 0 12px rgba(0,176,255,0.6)}
.bike{background:#00E676;box-shadow:0 0 12px rgba(0,230,118,0.6)}
.run{background:#FC4C02;box-shadow:0 0 12px rgba(252,76,2,0.6)}
</style></head><body>
<div class="s">
  <div class="glow"></div><div class="ring"></div><div class="ring2"></div>
  <div class="label">FIRST LIGHT</div>
  <div class="day">111</div>
  <div class="sub">NEW ERA BEGINS</div>
  <div class="tri"><span class="swim"></span><span class="bike"></span><span class="run"></span></div>
</div>
</body></html>
