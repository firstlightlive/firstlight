<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#030608;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1080px;background:#030608;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;padding:120px}
.s::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,230,118,0.04) 0%,transparent 60%)}
.line{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:300;color:rgba(255,255,255,0.35);letter-spacing:4px;line-height:2.8}
.line em{color:#fff;font-style:normal;font-weight:600;font-size:26px}
.accent{color:#FC4C02}
.dim{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.1);position:absolute;bottom:80px}
</style></head><body>
<div class="s">
<div class="line">
The body wanted to stop.<br>
<em>I didn't listen.</em><br><br>
The mind made excuses.<br>
<em>I didn't negotiate.</em><br><br>
The alarm rang at <span class="accent">3:15 AM.</span><br>
<em>I didn't snooze.</em><br><br>
111 times.
</div>
<div class="dim">◆ FIRST LIGHT</div>
</div>
</body></html>
