<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="_base.css">
<style>
  html,body{width:1080px;height:1080px}
  body{padding:70px 80px 60px}
  body::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%,rgba(0,230,118,0.08),transparent 60%);}
  .top{text-align:center}
  .kicker{font-size:16px;letter-spacing:7px;color:rgba(255,255,255,0.45);margin-top:18px}
  .frame{align-self:center;background:#fff;border-radius:16px;padding:16px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 0 2px rgba(0,230,118,0.35);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .doc{position:relative;display:inline-block}
  .doc img{display:block;max-height:600px;width:auto;border-radius:6px}
  /* privacy redaction over Mobile / Email / PAN block */
  .redact{position:absolute;left:3.5%;top:28.5%;width:40%;height:9.5%;
    background:#1a1d24;border-radius:3px;display:flex;align-items:center;
    justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:2px;
    color:rgba(255,255,255,0.55)}
  .bottom{text-align:center}
  .cap{font-size:20px;letter-spacing:3px;color:#fff;font-weight:700}
  .cap-sub{font-size:15px;letter-spacing:3px;color:rgba(255,255,255,0.45);margin-top:12px}
  .cap-sub .g{color:var(--green)}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="kicker">OFFICIAL · TAX-DEDUCTIBLE · REAL</div>
  </div>
  <div class="frame"><div class="doc"><img src="assets/bill.png" alt="80G donation receipt"><div class="redact">🔒 PRIVATE DETAILS REDACTED</div></div></div>
  <div class="bottom">
    <div class="cap">80G RECEIPT · BLR-225-154562</div>
    <div class="cap-sub"><span class="g">✓</span> THE AKSHAYA PATRA FOUNDATION · SEC 80G(5) · ₹1,500</div>
  </div>
</div>
<div class="pageno">05 / 05</div>
</body></html>
