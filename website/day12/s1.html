<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="_base.css">
<style>
  html,body{width:1080px;height:1080px}
  body{padding:80px 80px 70px;justify-content:space-between}
  body::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,rgba(255,82,82,0.14),transparent 58%);}
  .top{text-align:center}
  .center{text-align:center;margin-top:-20px}
  .kicker{font-size:17px;letter-spacing:9px;color:rgba(255,255,255,0.5);margin-bottom:30px}
  .missed{font-size:200px;color:var(--red);text-shadow:0 0 90px rgba(255,82,82,0.28)}
  .rule{display:flex;gap:18px;justify-content:center;margin-top:44px;flex-wrap:wrap}
  .chip{font-size:17px;letter-spacing:3px;color:rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.14);padding:12px 20px;border-radius:6px}
  .bottom{text-align:center}
  .line{width:64px;height:3px;background:var(--red);margin:0 auto 26px;border-radius:2px;opacity:0.8}
  .sub{font-size:22px;letter-spacing:2px;color:rgba(255,255,255,0.55);line-height:1.6}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="day-line">CHAPTER 02 · ENDURANCE · DAY 12</div>
  </div>
  <div class="center">
    <div class="kicker">THE DAY I DIDN'T MOVE</div>
    <div class="serif-hero missed">MISSED.</div>
    <div class="rule">
      <span class="chip">NO RUN</span>
      <span class="chip">NO RIDE</span>
      <span class="chip">NO SWIM</span>
      <span class="chip">NO EXCUSE</span>
    </div>
  </div>
  <div class="bottom">
    <div class="line"></div>
    <div class="sub">The streak was never about being perfect.<br>It's about what happens when you're not.</div>
  </div>
</div>
<div class="swipe">SWIPE →</div>
<div class="pageno">01 / 05</div>
</body></html>
