<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="_base.css">
<style>
  html,body{width:1080px;height:1080px}
  body{padding:80px 80px 70px;justify-content:space-between}
  body::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 60%,rgba(245,166,35,0.14),transparent 60%);}
  .top{text-align:center}
  .kicker{font-size:16px;letter-spacing:7px;color:rgba(255,255,255,0.45);margin-top:20px}
  .center{text-align:center}
  .arrow{font-size:20px;letter-spacing:6px;color:rgba(255,255,255,0.4);margin-bottom:8px}
  .amount{font-size:180px;letter-spacing:-4px;
    background:linear-gradient(180deg,var(--gold-lt) 8%,var(--gold));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    text-shadow:0 0 80px rgba(245,166,35,0.10)}
  .to{font-size:24px;letter-spacing:4px;color:var(--gold);font-weight:700;margin-top:18px}
  .grid{display:flex;justify-content:center;gap:0;margin-top:56px;
    border-top:1px solid rgba(255,255,255,0.1);border-bottom:1px solid rgba(255,255,255,0.1)}
  .cell{flex:1;text-align:center;padding:32px 10px}
  .cell + .cell{border-left:1px solid rgba(255,255,255,0.08)}
  .cell .big{font-family:var(--serif);font-size:56px;color:#fff;line-height:1}
  .cell .lbl{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.45);margin-top:14px}
  .bottom{text-align:center}
  .say{font-size:23px;line-height:1.55;color:rgba(255,255,255,0.7)}
  .say b{color:var(--gold-lt);font-weight:700}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="kicker">MY MISS HAS A PRICE — AND SOMEONE ELSE COLLECTS IT</div>
  </div>
  <div class="center">
    <div class="arrow">I OWED</div>
    <div class="serif-hero amount">₹1,500</div>
    <div class="to">→ AKSHAYA PATRA FOUNDATION</div>
    <div class="grid">
      <div class="cell"><div class="big">1</div><div class="lbl">CHILD</div></div>
      <div class="cell"><div class="big">1</div><div class="lbl">SCHOOL YEAR</div></div>
      <div class="cell"><div class="big">200</div><div class="lbl">MID-DAY MEALS</div></div>
    </div>
  </div>
  <div class="bottom">
    <div class="say">I skipped one workout.<br>So <b>a child in India eats lunch every school day for a year.</b></div>
  </div>
</div>
<div class="swipe">SWIPE →</div>
<div class="pageno">02 / 05</div>
</body></html>
