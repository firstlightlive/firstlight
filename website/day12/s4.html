<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="_base.css">
<style>
  html,body{width:1080px;height:1080px}
  body{padding:70px 80px 60px}
  body::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%,rgba(245,166,35,0.10),transparent 60%);}
  .top{text-align:center}
  .kicker{font-size:16px;letter-spacing:7px;color:rgba(255,255,255,0.45);margin-top:18px}
  .frame{align-self:center;background:#fff;border-radius:20px;padding:14px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 0 2px rgba(245,166,35,0.4);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .frame img{display:block;max-height:560px;width:auto;border-radius:8px}
  .bottom{text-align:center}
  .cap{font-size:20px;letter-spacing:3px;color:#fff;font-weight:700}
  .cap-sub{font-size:15px;letter-spacing:3px;color:rgba(255,255,255,0.45);margin-top:12px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="kicker">THE MONEY ACTUALLY MOVED</div>
  </div>
  <div class="frame"><img src="assets/upi.jpeg" alt="UPI transfer"></div>
  <div class="bottom">
    <div class="cap">₹1,500 · BANK TRANSFER · UPI</div>
    <div class="cap-sub">AXIS BANK → AKSHAYA PATRA · 02 JUL 2026 · TXN 996515181836</div>
  </div>
</div>
<div class="swipe">SWIPE →</div>
<div class="pageno">04 / 05</div>
</body></html>
