<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="_base.css">
<style>
  html,body{width:1080px;height:1080px}
  body{padding:80px 80px 70px;justify-content:space-between}
  body::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%,rgba(0,230,118,0.10),transparent 55%);}
  .top{text-align:center}
  .kicker{font-size:16px;letter-spacing:7px;color:rgba(255,255,255,0.45);margin-top:20px}
  .center{margin-top:8px}
  .receipt{background:rgba(0,0,0,0.5);border:1px solid rgba(245,166,35,0.35);border-radius:14px;
    padding:38px 40px;box-shadow:inset 0 0 40px rgba(245,166,35,0.04)}
  .r-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:19px;letter-spacing:1px}
  .r-row + .r-row{border-top:1px solid rgba(255,255,255,0.07)}
  .r-k{color:rgba(255,255,255,0.45);letter-spacing:2px;font-size:15px}
  .r-v{color:#fff;font-weight:700}
  .paid{color:var(--green);font-weight:700}
  .hold{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:52px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(0,230,118,0.7)}
  .hold-t{font-family:var(--serif);font-size:52px;color:#fff;letter-spacing:-1px}
  .hold-t b{color:var(--green)}
  .bottom{text-align:center}
  .back{font-size:22px;letter-spacing:4px;color:rgba(255,255,255,0.6);margin-bottom:22px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="kicker">PROOF · NOT PROMISES</div>
  </div>
  <div class="center">
    <div class="receipt">
      <div class="r-row"><span class="r-k">DONATED</span><span class="r-v">₹1,500.00</span></div>
      <div class="r-row"><span class="r-k">TO</span><span class="r-v">Akshaya Patra Foundation</span></div>
      <div class="r-row"><span class="r-k">80G RECEIPT</span><span class="r-v">BLR-225-154562</span></div>
      <div class="r-row"><span class="r-k">DATE</span><span class="r-v">02 JUL 2026</span></div>
      <div class="r-row"><span class="r-k">STATUS</span><span class="paid">✓ PAID IN FULL</span></div>
    </div>
    <div class="hold">
      <span class="dot"></span>
      <div class="hold-t">The streak <b>holds.</b></div>
    </div>
  </div>
  <div class="bottom">
    <div class="back">MISSED ONCE. PAID IN FULL. BACK TOMORROW.</div>
    <div class="domain">firstlight.live</div>
  </div>
</div>
<div class="pageno">03 / 05</div>
</body></html>
