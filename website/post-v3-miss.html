<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>FIRST LIGHT — MISS v3 (sun not risen)</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'IBM Plex Mono',monospace;background:#01020A}

/* night sky — colder, deeper, the sun has NOT risen */
.sky{position:absolute;inset:0 0 530px 0;
 background:linear-gradient(180deg,#01020A 0%,#050A14 40%,#0A1220 68%,#101828 88%,#181E2C 100%)}
/* the light waiting BELOW the horizon */
.waits{position:absolute;left:50%;top:806px;transform:translateX(-50%);width:1000px;height:120px;
 background:radial-gradient(ellipse,rgba(245,166,35,0.16) 0%,rgba(252,76,2,0.05) 45%,transparent 70%);filter:blur(20px)}
.stars{position:absolute;inset:0 0 530px 0}
.stars svg{width:100%;height:100%}
.stars circle{fill:#FFFFFF}

.horizon{position:absolute;top:819px;left:0;right:0;height:1px;
 background:linear-gradient(90deg,transparent 15%,rgba(245,166,35,0.35) 45%,rgba(245,166,35,0.6) 50%,rgba(245,166,35,0.35) 55%,transparent 85%)}

.ground{position:absolute;top:820px;left:0;right:0;bottom:0;background:linear-gradient(180deg,#07080E 0%,#04050A 50%,#020307 100%)}
.road{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.7}
.road svg{width:100%;height:100%}

/* center stack */
.center{position:absolute;top:130px;left:80px;right:80px;text-align:center}
.kicker{font-size:15px;letter-spacing:8px;color:rgba(255,255,255,0.45);margin-bottom:36px}
.miss{font-size:200px;font-weight:200;letter-spacing:-8px;line-height:0.9;
 background:linear-gradient(180deg,#FFFFFF 0%,rgba(255,255,255,0.5) 60%,rgba(255,255,255,0.08) 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.debt{font-size:110px;font-weight:600;letter-spacing:-4px;line-height:1;margin-top:48px;
 background:linear-gradient(180deg,#FFD98A 0%,#F5A623 55%,rgba(245,166,35,0.2) 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 60px rgba(245,166,35,0.28))}
.debtunit{font-size:22px;letter-spacing:12px;color:rgba(245,166,35,0.65);margin-top:18px}
.line{font-size:19px;letter-spacing:8px;color:rgba(255,255,255,0.55);margin-top:44px}
.line b{color:#00E676;font-weight:600}
.modes{display:flex;gap:12px;margin-top:40px;justify-content:center}
.modes span{font-size:13px;letter-spacing:2px;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:9px 16px}
.modes .on{border-color:rgba(245,166,35,0.5);color:#F5A623;background:rgba(245,166,35,0.06)}

/* the poem, in the dark ground */
.gpoem{position:absolute;left:80px;right:80px;top:60px;text-align:center}
.gpoem .l1{font-size:22px;font-weight:600;letter-spacing:5px;color:#FFFFFF}
.gpoem .l2{font-size:14px;letter-spacing:6px;color:rgba(255,255,255,0.4);margin-top:14px}

.hd{position:absolute;top:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-size:15px;font-weight:600;letter-spacing:10px;color:rgba(255,255,255,0.85)}
.brand b{color:#F5A623;font-weight:600}
.meta{font-size:15px;letter-spacing:5px;color:rgba(255,255,255,0.5)}

.ft{position:absolute;bottom:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.ftnote{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.35)}
.dots{display:flex;gap:8px;align-items:center}
.dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.18)}
.dots .on{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,0.7)}

.frame{position:absolute;inset:26px;border:1px solid rgba(255,255,255,0.06);border-radius:18px;pointer-events:none;z-index:6}
.corner{position:absolute;width:26px;height:26px;border-color:#F5A623;border-style:solid;opacity:0.7;z-index:6}
.c1{top:14px;left:14px;border-width:2px 0 0 2px;border-radius:6px 0 0 0}
.c2{top:14px;right:14px;border-width:2px 2px 0 0;border-radius:0 6px 0 0}
.c3{bottom:14px;left:14px;border-width:0 0 2px 2px;border-radius:0 0 0 6px}
.c4{bottom:14px;right:14px;border-width:0 2px 2px 0;border-radius:0 0 6px 0}

.grain{position:absolute;inset:0;opacity:0.045;pointer-events:none;z-index:7;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
 <div class="sky"></div>
 <div class="stars"><svg viewBox="0 0 1080 820" preserveAspectRatio="none">
  <circle cx="90" cy="120" r="1.6" opacity="0.7"/><circle cx="230" cy="260" r="1.2" opacity="0.4"/>
  <circle cx="340" cy="90" r="1.8" opacity="0.6"/><circle cx="500" cy="200" r="1.1" opacity="0.4"/>
  <circle cx="650" cy="110" r="1.5" opacity="0.5"/><circle cx="790" cy="240" r="1.2" opacity="0.4"/>
  <circle cx="930" cy="130" r="1.7" opacity="0.55"/><circle cx="150" cy="400" r="1.2" opacity="0.3"/>
  <circle cx="420" cy="360" r="1.3" opacity="0.3"/><circle cx="760" cy="400" r="1.2" opacity="0.28"/>
  <circle cx="1010" cy="330" r="1.4" opacity="0.32"/><circle cx="560" cy="300" r="1.1" opacity="0.3"/>
 </svg></div>
 <div class="waits"></div>
 <div class="horizon"></div>

 <div class="ground">
  <div class="road"><svg viewBox="0 0 1080 530" preserveAspectRatio="none">
   <polygon points="200,530 880,530 600,0 480,0" fill="#0A0C13"/>
   <path d="M540,0 L540,530" stroke="rgba(245,166,35,0.14)" stroke-width="3" stroke-dasharray="12 22"/>
   <polygon points="200,530 880,530 600,0 480,0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  </svg></div>
  <div class="gpoem">
   <div class="l1">TOMORROW, THE SUN RISES AGAIN.</div>
   <div class="l2">NOT A FAILURE — A DEBT. PAID IN DISTANCE.</div>
  </div>
 </div>

 <div class="center">
  <div class="kicker">MISS LOGGED — DAY 12</div>
  <div class="miss">MISS</div>
  <div class="debt">100 KM</div>
  <div class="debtunit">CYCLE DEBT</div>
  <div class="line">PAYING IN <b>DISTANCE</b>.</div>
  <div class="modes"><span class="on">CYCLE ×2</span><span>WALK ×1</span><span>RUN ×1</span><span>SWIM ×4</span></div>
 </div>

 <div class="hd"><div class="brand">◆ FIRST <b>LIGHT</b></div><div class="meta">DISCIPLINE LEDGER</div></div>
 <div class="ft"><div class="ftnote">THE SUN WAITS. SO DOES THE DEBT.</div><div class="dots"><span></span><span class="on"></span><span></span></div></div>
 <div class="frame"></div><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
 <div class="grain"></div>
</div>
</body></html>
