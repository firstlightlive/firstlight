<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}.s{width:1080px;height:1080px;position:relative;overflow:hidden;background:#000}

/* Photo — bright, vivid, the riders are the story */.bg{position:absolute;inset:0;background:url('IMG_9508.jpg') center center/cover;
 filter:brightness(0.82) contrast(1.08) saturate(1.15)}

/* Soft vignette — guide eyes to center */.vig{position:absolute;inset:0;
 background:radial-gradient(ellipse 80% 75% at 40% 48%, transparent 35%, rgba(0,0,0,0.45) 100%)}

/* Bottom fade — smooth, no hard edge, just enough for the stat */.fade{position:absolute;inset:0;
 background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.25) 65%, rgba(0,0,0,0.75) 82%, rgba(0,0,0,0.93) 100%)}

/* Top center darken for route readability */.corner{position:absolute;top:0;left:0;right:0;height:420px;
 background:linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.3) 50%, transparent 100%)}

/* Route — floating transparent, just the trace */.route-card{position:absolute;top:10px;right:60px;width:600px;height:340px;
 overflow:hidden;
 background:transparent;
 display:flex;align-items:flex-start;justify-content:center}.route-card img{width:100%;height:auto;margin-top:-10px;
 filter:drop-shadow(0 0 20px rgba(252,76,2,0.4)) drop-shadow(0 0 50px rgba(252,76,2,0.15))}

/* Top stat — 152 KM */.stat{position:absolute;top:40px;left:50px;display:flex;align-items:baseline;gap:14px;
 text-shadow:0 2px 12px rgba(0,0,0,0.8)}.stat.num{font-family:'IBM Plex Mono',monospace;font-size:80px;font-weight:200;color:#FC4C02;letter-spacing:-3px;
 filter:drop-shadow(0 0 30px rgba(252,76,2,0.25))}.stat.unit{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:10px;color:rgba(255,255,255,0.5);font-weight:400}

/* Bottom branding — visible */.brand{position:absolute;bottom:50px;left:0;right:0;text-align:center}.brand span{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:8px;font-weight:600;
 background:linear-gradient(90deg,#FC4C02,#FF8A50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 10px rgba(252,76,2,0.15))}

/* Film grain — subtle texture */.grain{position:absolute;inset:0;opacity:0.035;pointer-events:none;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
 <div class="bg"></div>
 <div class="vig"></div>
 <div class="fade"></div>
 <div class="corner"></div>

 <div class="route-card">
 <img src="IMG_9517.PNG" alt="152km route">
 </div>

 <div class="stat">
 <div class="num">152</div>
 <div class="unit">KM</div>
 </div>

 <div class="brand"><span>WWW.FIRSTLIGHT.LIVE</span></div>
 <div class="grain"></div>
</div>
</body></html>
