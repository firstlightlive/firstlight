<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<title>FIRST LIGHT — Daily Story · Selfie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0C10}
  body{font-family:'IBM Plex Mono',monospace;color:#fff;position:relative}

  /* PHOTO LAYER — replace background-image with your post-run selfie */
  .photo{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#1a1410 0%,#3d2818 35%,#5c3a1f 65%,#1a1410 100%);
    background-image:url('SELFIE_URL_HERE');
    background-size:cover;background-position:center;
  }
  .photo-tint{
    position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(0,0,0,0.75) 0%,
      rgba(0,0,0,0.15) 28%,
      rgba(0,0,0,0.15) 65%,
      rgba(0,0,0,0.92) 100%);
  }
  .grain{
    position:absolute;inset:0;z-index:9;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:0.05;pointer-events:none;
  }

  /* TOP — timestamp anchored */
  .top{
    position:absolute;top:90px;left:70px;right:70px;
    z-index:5;
  }
  .timestamp{
    font-size:42px;font-weight:700;letter-spacing:6px;
    color:#fff;text-shadow:0 2px 14px rgba(0,0,0,0.85);
  }
  .top-line{
    font-size:16px;letter-spacing:5px;
    color:rgba(255,255,255,0.75);
    margin-top:18px;
    text-shadow:0 1px 8px rgba(0,0,0,0.7);
  }
  .top-divider{
    margin-top:26px;width:120px;height:3px;
    background:#F5A623;box-shadow:0 0 16px rgba(245,166,35,0.6);
  }
  .top-brand{
    margin-top:22px;font-size:13px;letter-spacing:6px;
    color:rgba(245,166,35,0.85);font-weight:700;
    text-shadow:0 1px 8px rgba(0,0,0,0.7);
  }

  /* BOTTOM — proof anchored */
  .bottom{
    position:absolute;bottom:90px;left:70px;right:70px;
    z-index:5;text-align:center;
  }
  .bottom-divider{
    width:100%;height:1px;
    background:rgba(255,255,255,0.35);
    margin-bottom:38px;
  }
  .stats-line{
    font-size:40px;font-weight:700;letter-spacing:6px;
    color:#fff;margin-bottom:34px;
    text-shadow:0 2px 14px rgba(0,0,0,0.85);
  }
  .proof-badge{
    display:inline-block;
    background:rgba(245,166,35,0.18);
    border:2px solid #F5A623;
    padding:20px 38px;border-radius:10px;
    font-size:28px;font-weight:700;letter-spacing:6px;
    color:#F5A623;margin-bottom:36px;
    box-shadow:0 0 40px rgba(245,166,35,0.25);
  }
  .proof-margin{
    font-size:14px;letter-spacing:4px;
    color:rgba(245,166,35,0.65);margin-top:-22px;
    margin-bottom:32px;
  }
  .brand-footer{
    font-size:16px;letter-spacing:6px;
    color:rgba(255,255,255,0.7);
    text-shadow:0 1px 8px rgba(0,0,0,0.7);
  }
  .strava-tag,.garmin-tag{
    display:inline-block;color:#fff;
    padding:5px 12px;border-radius:4px;
    font-size:11px;font-weight:700;letter-spacing:2.5px;
    margin-right:8px;vertical-align:middle;
  }
  .strava-tag{background:#FC4C02}
  .garmin-tag{background:#0084c8}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="photo-tint"></div>
  <div class="grain"></div>

  <div class="top">
    <div class="timestamp" id="timestamp">04:48 AM</div>
    <div class="top-line"><span id="date">10 JUN 2026</span> · DAY <span id="day">111</span></div>
    <div class="top-divider"></div>
    <div class="top-brand">◆ FIRST LIGHT</div>
  </div>

  <div class="bottom">
    <div class="bottom-divider"></div>
    <div class="stats-line"><span id="km">5.2</span> KM · <span id="duration">33:14</span></div>
    <div class="proof-badge">✓ BEFORE 6:00 AM</div>
    <div class="proof-margin"><span id="margin">1H 12M</span> MARGIN</div>
    <div class="brand-footer"><span class="garmin-tag">GARMIN</span><span class="strava-tag">STRAVA</span>firstlight.live</div>
  </div>
</body>
</html>
