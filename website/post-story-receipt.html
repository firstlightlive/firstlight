<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIRST LIGHT — Daily Story · Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0C10}
  body{
    font-family:'IBM Plex Mono',monospace;
    color:rgba(255,255,255,0.85);
    padding:90px 70px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  body::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:0.04;
    pointer-events:none;
    z-index:1;
  }
  body::after{
    content:'';
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at top,rgba(245,166,35,0.05),transparent 60%);
    pointer-events:none;
    z-index:1;
  }
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}

  .header{text-align:center;margin-bottom:24px}
  .brand{font-size:22px;letter-spacing:9px;color:#F5A623;font-weight:700}
  .day-line{
    font-size:16px;letter-spacing:5px;
    color:rgba(255,255,255,0.55);margin-top:18px;
  }

  .hero{text-align:center;margin:50px 0 40px}
  .hero-km{
    font-family:'Playfair Display',serif;
    font-size:240px;font-weight:900;line-height:0.9;letter-spacing:-6px;
    background:linear-gradient(180deg,#fff 25%,rgba(245,166,35,0.85));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .hero-unit{
    font-size:20px;letter-spacing:10px;
    color:rgba(255,255,255,0.5);margin-top:30px;
  }
  .hero-duration{
    font-size:36px;font-weight:700;
    color:rgba(255,255,255,0.8);margin-top:32px;letter-spacing:7px;
  }

  .time-strip{
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.1);
    padding:32px 36px;border-radius:10px;
    margin:36px 0;
  }
  .time-row{
    display:flex;justify-content:space-between;
    font-size:22px;letter-spacing:3px;
    padding:10px 0;
  }
  .time-label{color:rgba(255,255,255,0.45)}
  .time-value{color:rgba(255,255,255,0.95);font-weight:700}

  .proof{
    text-align:center;padding:34px 28px;
    background:linear-gradient(180deg,rgba(245,166,35,0.12),rgba(245,166,35,0.05));
    border:2px solid #F5A623;border-radius:12px;
    margin:28px 0;
    box-shadow:0 0 60px rgba(245,166,35,0.12),inset 0 0 30px rgba(245,166,35,0.04);
  }
  .proof-line{
    font-size:32px;font-weight:700;letter-spacing:5px;color:#F5A623;
  }
  .proof-margin{
    font-size:16px;color:rgba(245,166,35,0.7);
    margin-top:16px;letter-spacing:4px;
  }

  .stats-row{
    display:flex;justify-content:space-around;
    margin:34px 0 24px;padding:24px 0;
    border-top:1px solid rgba(255,255,255,0.08);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .stat-block{text-align:center;flex:1}
  .stat-label{
    font-size:12px;letter-spacing:3px;
    color:rgba(255,255,255,0.4);margin-bottom:10px;
  }
  .stat-value{
    font-size:26px;font-weight:700;
    color:rgba(255,255,255,0.9);
  }

  .footer{text-align:center;margin-top:auto;padding-top:32px}
  .verified-row{
    display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:16px;
  }
  .garmin-badge{
    display:inline-block;background:#0084c8;color:#fff;
    padding:8px 16px;border-radius:5px;
    font-size:13px;font-weight:700;letter-spacing:2.5px;
  }
  .strava-badge{
    display:inline-block;background:#FC4C02;color:#fff;
    padding:8px 16px;border-radius:5px;
    font-size:13px;font-weight:700;letter-spacing:2.5px;
  }
  .footer-domain{
    font-size:16px;color:rgba(255,255,255,0.5);letter-spacing:5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">◆ FIRST LIGHT</div>
    <div class="day-line">DAY <span id="day">111</span> · <span id="dayName">WED</span> · <span id="date">10 JUN 2026</span></div>
  </div>

  <div class="hero">
    <div class="hero-km"><span id="km">5.2</span></div>
    <div class="hero-unit">KILOMETERS</div>
    <div class="hero-duration"><span id="duration">33:14</span></div>
  </div>

  <div class="time-strip">
    <div class="time-row"><span class="time-label">STARTED</span><span class="time-value" id="startTime">04:12 AM</span></div>
    <div class="time-row"><span class="time-label">ENDED</span><span class="time-value" id="endTime">04:48 AM</span></div>
    <div class="time-row"><span class="time-label">DEADLINE</span><span class="time-value">06:00 AM</span></div>
  </div>

  <div class="proof">
    <div class="proof-line">✓ BEFORE 6:00 AM</div>
    <div class="proof-margin"><span id="margin">1H 12M</span> MARGIN</div>
  </div>

  <div class="stats-row">
    <div class="stat-block">
      <div class="stat-label">PACE</div>
      <div class="stat-value"><span id="pace">6:25</span>/KM</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">HR AVG</div>
      <div class="stat-value" id="hr">142</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">ELEV</div>
      <div class="stat-value"><span id="elev">12</span>M</div>
    </div>
  </div>

  <div class="footer">
    <div class="verified-row">
      <div class="garmin-badge">GARMIN</div>
      <div class="strava-badge">STRAVA</div>
    </div>
    <div class="footer-domain">firstlight.live</div>
  </div>
</div>
</body>
</html>
