<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1080px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.s::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00B0FF 30%,#00E676 50%,#FC4C02 70%,transparent);opacity:0.5}
.s::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00B0FF 30%,#00E676 50%,#FC4C02 70%,transparent);opacity:0.2}
.gl1{position:absolute;top:35%;left:20%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,176,255,0.04) 0%,transparent 60%);filter:blur(40px)}
.gl2{position:absolute;top:35%;left:50%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,230,118,0.04) 0%,transparent 60%);filter:blur(40px)}
.gl3{position:absolute;top:35%;right:20%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(252,76,2,0.04) 0%,transparent 60%);filter:blur(40px)}
.dist{display:flex;gap:60px;margin-bottom:60px}
.d{text-align:center}
.d .v{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:200;line-height:1}
.d .u{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.25);margin-top:8px}
.title{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:12px;color:rgba(255,255,255,0.2);margin-bottom:40px}
.line{width:60px;height:1px;background:rgba(255,255,255,0.06);margin-bottom:40px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:300;letter-spacing:4px;color:rgba(255,255,255,0.2)}
.tag em{color:rgba(255,255,255,0.6);font-style:normal;font-weight:400}
.url{position:absolute;bottom:70px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:8px;color:rgba(255,255,255,0.08)}
.grain{position:absolute;inset:0;opacity:0.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
<div class="gl1"></div><div class="gl2"></div><div class="gl3"></div>
<div class="title">IRONMAN 140.6</div>
<div class="dist">
<div class="d"><div class="v" style="color:#00B0FF">3.8</div><div class="u">KM SWIM</div></div>
<div class="d"><div class="v" style="color:#00E676">180</div><div class="u">KM BIKE</div></div>
<div class="d"><div class="v" style="color:#FC4C02">42.2</div><div class="u">KM RUN</div></div>
</div>
<div class="line"></div>
<div class="tag"><em>One day.</em> Every year.</div>
<div class="url">FIRSTLIGHT.LIVE</div>
<div class="grain"></div>
</div>
</body></html>
