<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}.s{width:1080px;height:1080px;position:relative;overflow:hidden;background:#050607;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Strava orange deep glow */.s::before{content:'';position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;
 background:radial-gradient(circle,rgba(252,76,2,0.06) 0%,rgba(252,76,2,0.02) 30%,transparent 60%);filter:blur(60px)}.s::after{content:'';position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;
 background:radial-gradient(circle,rgba(252,76,2,0.08) 0%,transparent 50%);filter:blur(30px)}

/* Top label */.label{position:absolute;top:180px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:12px;color:rgba(252,76,2,0.4);font-weight:600}

/* The number */.num{font-family:'IBM Plex Mono',monospace;font-size:280px;font-weight:200;letter-spacing:-12px;line-height:0.75;
 margin-top:-80px;
 color:transparent;
 background:linear-gradient(180deg,rgba(255,255,255,0.9) 0%,rgba(252,76,2,0.6) 40%,rgba(252,76,2,0.2) 70%,transparent 90%);
 -webkit-background-clip:text;background-clip:text;
 filter:drop-shadow(0 0 80px rgba(252,76,2,0.08))}

/* Reflection */.ref{font-family:'IBM Plex Mono',monospace;font-size:280px;font-weight:200;letter-spacing:-12px;line-height:0.75;
 color:transparent;
 background:linear-gradient(180deg,rgba(252,76,2,0.04) 0%,transparent 20%);
 -webkit-background-clip:text;background-clip:text;
 transform:scaleY(-0.2);transform-origin:top;filter:blur(3px);margin-top:6px}

/* KM unit */.unit{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:300;letter-spacing:16px;
 color:rgba(252,76,2,0.35);margin-top:50px}

/* Horizon line */.horizon{position:absolute;top:60%;left:0;right:0;height:1px;
 background:linear-gradient(90deg,transparent 10%,rgba(252,76,2,0.15) 30%,rgba(255,255,255,0.12) 50%,rgba(252,76,2,0.15) 70%,transparent 90%)}

/* Bottom message */.msg{position:absolute;bottom:200px;text-align:center}.msg.line1{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:8px;color:rgba(255,255,255,0.25);font-weight:400;line-height:2.2}.msg.line2{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:4px;font-weight:600;margin-top:12px;
 background:linear-gradient(90deg,#FC4C02,#FF8A50);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* CTA */.cta{position:absolute;bottom:110px;text-align:center}.cta.url{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:8px;color:rgba(255,255,255,0.08);font-weight:400}

/* Tri dots */.dots{position:absolute;bottom:60px;display:flex;gap:12px}.dots span{width:4px;height:4px;border-radius:50%}.d1{background:#FC4C02;box-shadow:0 0 6px rgba(252,76,2,0.5)}.d2{background:rgba(255,255,255,0.15)}

/* Film grain */.grain{position:absolute;inset:0;opacity:0.04;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}.scan{position:absolute;inset:0;pointer-events:none;opacity:0.01;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.5) 2px,transparent 4px)}
</style></head><body>
<div class="s">
 <div class="label">GROUP RIDE</div>
 <div class="num">152</div>
 <div class="ref">152</div>
 <div class="unit">KILOMETERS</div>
 <div class="horizon"></div>

 <div class="msg">
 <div class="line1">LONGEST RIDE YET</div>
 <div class="line2">IRONMAN TRAINING</div>
 </div>

 <div class="cta">
 <div class="url">FIRSTLIGHT.LIVE</div>
 </div>
 <div class="dots"><span class="d1"></span><span class="d2"></span></div>
 <div class="grain"></div>
 <div class="scan"></div>
</div>
</body></html>
