<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>FIRST LIGHT — MILESTONE v3 (sun risen)</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'IBM Plex Mono',monospace;background:#0B1424}

/* full dawn — the sun has risen */
.sky{position:absolute;inset:0;
 background:linear-gradient(180deg,#12233E 0%,#1E3A5E 30%,#3A5A82 55%,#6A6A7A 74%,#A08A6A 88%,#C8A878 100%)}
/* risen sun + rays */
.sun{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;
 background:radial-gradient(circle at 50% 45%,#FFF9E8 0%,#FFE3A0 40%,#F5A623 75%,#FC4C02 100%);
 box-shadow:0 0 160px rgba(245,166,35,0.6),0 0 70px rgba(252,76,2,0.35)}
.rays{position:absolute;left:50%;top:280px;transform:translateX(-50%);width:900px;height:900px}
.rays svg{width:100%;height:100%}

/* ground — light-washed */
.ground{position:absolute;top:840px;left:0;right:0;bottom:0;
 background:linear-gradient(180deg,#20242E 0%,#10131A 45%,#07090E 100%)}
.horizon{position:absolute;top:838px;left:0;right:0;height:2px;
 background:linear-gradient(90deg,transparent 10%,rgba(245,166,35,0.7) 40%,#FFE9B0 50%,rgba(245,166,35,0.7) 60%,transparent 90%)}

/* the number rises from the ground into the light */
.center{position:absolute;top:400px;left:80px;right:80px;text-align:center}
.day{font-size:240px;font-weight:200;letter-spacing:-10px;line-height:0.9;
 background:linear-gradient(180deg,#FFF9E8 0%,#F5A623 60%,rgba(245,166,35,0.15) 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 70px rgba(245,166,35,0.35))}
.dayunit{font-size:24px;letter-spacing:14px;color:rgba(245,166,35,0.7);margin-top:24px}
.kicker{font-size:16px;letter-spacing:10px;color:rgba(255,255,255,0.55);margin-bottom:20px}

.earned{display:inline-block;font-size:15px;letter-spacing:6px;color:rgba(0,230,118,0.9);margin-top:44px;
 border:1px solid rgba(0,230,118,0.4);border-radius:99px;padding:10px 24px;background:rgba(0,230,118,0.06)}
.reward{font-size:20px;letter-spacing:3px;color:#FFFFFF;margin-top:30px;line-height:1.6}
.reward b{color:#F5A623;font-weight:600}
.next{font-size:13px;letter-spacing:4px;color:rgba(255,255,255,0.4);margin-top:24px}
.next b{color:#00D4FF;font-weight:600}

/* ground reflection of the number */
.refl{position:absolute;left:80px;right:80px;top:52px;text-align:center;font-size:240px;font-weight:200;letter-spacing:-10px;line-height:0.75;
 color:transparent;background:linear-gradient(180deg,rgba(245,166,35,0.07) 0%,transparent 18%);
 -webkit-background-clip:text;background-clip:text;transform:scaleY(-0.18);transform-origin:top;filter:blur(4px)}

.hd{position:absolute;top:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-size:15px;font-weight:600;letter-spacing:10px;color:rgba(255,255,255,0.85)}
.brand b{color:#F5A623;font-weight:600}
.meta{font-size:15px;letter-spacing:5px;color:rgba(255,255,255,0.55)}

.ft{position:absolute;bottom:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.ftnote{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.4)}
.dots{display:flex;gap:8px;align-items:center}
.dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.18)}
.dots .on{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,0.7)}

.frame{position:absolute;inset:26px;border:1px solid rgba(255,255,255,0.07);border-radius:18px;pointer-events:none;z-index:6}
.corner{position:absolute;width:26px;height:26px;border-color:#F5A623;border-style:solid;opacity:0.8;z-index:6}
.c1{top:14px;left:14px;border-width:2px 0 0 2px;border-radius:6px 0 0 0}
.c2{top:14px;right:14px;border-width:2px 2px 0 0;border-radius:0 6px 0 0}
.c3{bottom:14px;left:14px;border-width:0 0 2px 2px;border-radius:0 0 0 6px}
.c4{bottom:14px;right:14px;border-width:0 2px 2px 0;border-radius:0 0 6px 0}

.grain{position:absolute;inset:0;opacity:0.04;pointer-events:none;z-index:7;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
 <div class="sky"></div>
 <div class="sun"></div>
 <div class="rays"><svg viewBox="0 0 900 900" preserveAspectRatio="none">
  <g stroke="rgba(245,166,35,0.15)" stroke-width="2">
   <line x1="450" y1="0" x2="120" y2="320"/><line x1="450" y1="0" x2="280" y2="300"/>
   <line x1="450" y1="0" x2="450" y2="290"/><line x1="450" y1="0" x2="620" y2="300"/>
   <line x1="450" y1="0" x2="780" y2="320"/><line x1="450" y1="0" x2="80" y2="480"/>
   <line x1="450" y1="0" x2="820" y2="480"/><line x1="450" y1="0" x2="60" y2="640"/>
   <line x1="450" y1="0" x2="840" y2="640"/>
  </g>
 </svg></div>
 <div class="horizon"></div>

 <div class="ground">
  <div class="refl">30</div>
 </div>

 <div class="center">
  <div class="kicker">30 STRAIGHT DAYS · ZERO MISSES</div>
  <div class="day">30</div>
  <div class="dayunit">DAYS OF DAWN</div>
  <div class="earned">✓ REWARD UNLOCKED</div>
  <div class="reward">LEG <b>COMPRESSION MACHINE</b><br>RECOVERY, EARNED.</div>
  <div class="next">NEXT: <b>DAY 45 — INSTA360 + TRIP</b></div>
 </div>

 <div class="hd"><div class="brand">◆ FIRST <b>LIGHT</b></div><div class="meta">MILESTONE EARNED</div></div>
 <div class="ft"><div class="ftnote">NOT A FINISH LINE — A CHECKPOINT.</div><div class="dots"><span></span><span class="on"></span><span></span></div></div>
 <div class="frame"></div><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
 <div class="grain"></div>
</div>
</body></html>
