<!DOCTYPE html><html><head>
  <meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>FIRST LIGHT — NIGHT RUN v4 (the beam)</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'IBM Plex Mono',monospace;background:#020308}

/* total darkness, faint stars only */
.stars{position:absolute;inset:0}
.stars svg{width:100%;height:100%}
.stars circle{fill:#FFFFFF}

/* the headlamp cone — light carving the dark */
.beam{position:absolute;left:-150px;bottom:-250px;width:1500px;height:1500px;
 background:conic-gradient(from 60deg at 42% 78%,
  rgba(255,238,190,0.0) 0deg,
  rgba(255,238,190,0.10) 8deg,
  rgba(255,238,190,0.16) 12deg,
  rgba(255,238,190,0.06) 18deg,
  rgba(255,238,190,0.0) 26deg);
 filter:blur(6px)}
.beamcore{position:absolute;left:-150px;bottom:-250px;width:1500px;height:1500px;
 background:conic-gradient(from 60deg at 42% 78%,
  rgba(255,244,214,0.0) 0deg,
  rgba(255,244,214,0.22) 9deg,
  rgba(255,244,214,0.3) 12deg,
  rgba(255,244,214,0.1) 16deg,
  rgba(255,244,214,0.0) 21deg);
 filter:blur(2px)}
/* lamp origin glow */
.lamp{position:absolute;left:330px;bottom:70px;width:60px;height:60px;border-radius:50%;
 background:radial-gradient(circle,#FFF9E8 0%,#FFE3A0 40%,rgba(245,166,35,0.15) 75%,transparent 100%);
 box-shadow:0 0 90px 30px rgba(255,238,190,0.35)}

/* the road revealed inside the beam */
.road{position:absolute;inset:0}
.road svg{width:100%;height:100%}

/* the day number, lit by the beam */
.num{position:absolute;left:0;right:0;top:180px;text-align:center;font-size:210px;font-weight:200;letter-spacing:-8px;line-height:1;
 background:linear-gradient(180deg,#FFF9E8 0%,#FFE3A0 55%,rgba(255,227,160,0.08) 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 70px rgba(255,238,190,0.35))}
.numunit{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:20px;letter-spacing:14px;color:rgba(255,238,190,0.75)}

/* copy inside the beam */
.copy{position:absolute;left:0;right:0;top:680px;text-align:center}
.copy .l1{font-size:19px;letter-spacing:8px;color:rgba(255,244,214,0.9)}
.copy .l2{font-size:14px;letter-spacing:5px;color:rgba(255,244,214,0.5);margin-top:16px}

/* stat line at beam base */
.hud{position:absolute;left:80px;right:80px;top:900px;display:flex;gap:14px}
.hud .h{flex:1;border:1px solid rgba(255,238,190,0.16);border-radius:12px;padding:14px;text-align:center;background:rgba(255,238,190,0.03)}
.hud .k{font-size:10px;letter-spacing:4px;color:rgba(255,238,190,0.45);margin-bottom:6px}
.hud .v{font-size:22px;font-weight:600;color:#FFE3A0}

.hd{position:absolute;top:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-size:15px;font-weight:600;letter-spacing:10px;color:rgba(255,238,190,0.8)}
.brand b{color:#F5A623;font-weight:600}
.meta{font-size:15px;letter-spacing:5px;color:rgba(255,238,190,0.45)}

.ft{position:absolute;bottom:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.ftnote{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.35)}
.dots{display:flex;gap:8px}
.dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.18)}
.dots .on{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,0.7)}

.frame{position:absolute;inset:26px;border:1px solid rgba(255,255,255,0.05);border-radius:18px;pointer-events:none;z-index:6}
.grain{position:absolute;inset:0;opacity:0.05;pointer-events:none;z-index:7;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
 <div class="stars"><svg viewBox="0 0 1080 1350" preserveAspectRatio="none">
  <circle cx="90" cy="140" r="1.5" opacity="0.6"/><circle cx="240" cy="90" r="1.2" opacity="0.4"/>
  <circle cx="420" cy="160" r="1.6" opacity="0.5"/><circle cx="600" cy="80" r="1.2" opacity="0.4"/>
  <circle cx="780" cy="150" r="1.5" opacity="0.55"/><circle cx="950" cy="110" r="1.3" opacity="0.45"/>
  <circle cx="120" cy="300" r="1.2" opacity="0.35"/><circle cx="880" cy="260" r="1.2" opacity="0.3"/>
  <circle cx="1020" cy="420" r="1.2" opacity="0.28"/><circle cx="60" cy="520" r="1.2" opacity="0.25"/>
 </svg></div>

 <div class="beam"></div><div class="beamcore"></div>
 <div class="road"><svg viewBox="0 0 1080 1350" preserveAspectRatio="none">
  <path d="M400,1350 C480,1100 560,950 640,800 S760,560 820,470" stroke="rgba(255,238,190,0.18)" stroke-width="5" fill="none"/>
  <path d="M400,1350 C480,1100 560,950 640,800 S760,560 820,470" stroke="rgba(255,238,190,0.4)" stroke-width="3" stroke-dasharray="2 26" fill="none" stroke-linecap="round"/>
 </svg></div>
 <div class="lamp"></div>

 <div class="num">7</div>
 <div class="numunit">DAYS · STREAK ALIVE</div>
 <div class="copy">
  <div class="l1">THE DARK DOESN'T COUNT THE KM</div>
  <div class="l2">04:58 · BEFORE THE SUN · DAY 7</div>
 </div>
 <div class="hud">
  <div class="h"><div class="k">DISTANCE</div><div class="v">12.4 KM</div></div>
  <div class="h"><div class="k">TIME</div><div class="v">68 MIN</div></div>
  <div class="h"><div class="k">START</div><div class="v">04:58</div></div>
 </div>

 <div class="hd"><div class="brand">◆ FIRST <b>LIGHT</b></div><div class="meta">NIGHT RUN</div></div>
 <div class="ft"><div class="ftnote">THE LIGHT FINDS YOU OUTSIDE.</div><div class="dots"><span class="on"></span><span></span><span></span></div></div>
 <div class="frame"></div>
 <div class="grain"></div>
</div>
</body></html>
