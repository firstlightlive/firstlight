<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:1080px;height:1080px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:120px}
.s::before{content:'';position:absolute;bottom:30%;left:50%;transform:translateX(-50%);width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(252,76,2,0.04) 0%,transparent 50%);filter:blur(50px)}
.q{font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:300;color:rgba(255,255,255,0.5);letter-spacing:2px;line-height:2;text-align:center}
.q em{color:#fff;font-style:normal;font-weight:600;font-size:40px}
.cta{position:absolute;bottom:120px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:6px;color:rgba(252,76,2,0.4)}
.url{position:absolute;bottom:70px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:8px;color:rgba(255,255,255,0.08)}
.grain{position:absolute;inset:0;opacity:0.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}
</style></head><body>
<div class="s">
<div class="q">What would you do<br>if <em>₹15,000</em> was on the line<br>every single day<br>you didn't show up?</div>
<div class="cta">SEE THE ANSWER</div>
<div class="url">FIRSTLIGHT.LIVE</div>
<div class="grain"></div>
</div>
</body></html>
