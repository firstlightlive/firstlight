# FirstLight Rituals — XcodeGen manifest
# Generate the Xcode project:  xcodegen generate  (run in this directory)
# Then open FirstLightRituals.xcodeproj, set your Team on both targets, ⌘R.
name: FirstLightRituals
options:
  bundleIdPrefix: live.firstlight
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "4"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: false
targets:
  FirstLightRituals:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.firstlight.rituals
    sources:
      - path: FirstLightRituals
      - path: Shared
    info:
      path: FirstLightRituals/Info.plist
      properties:
        CFBundleDisplayName: FL Rituals
        CFBundleName: FL Rituals
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKWatchOnly: true
        CFBundleURLTypes:
          - CFBundleURLName: live.firstlight.rituals
            CFBundleURLSchemes: [firstlight]
        UIBackgroundModes: []
    entitlements:
      path: FirstLightRituals/FirstLightRituals.entitlements
      properties:
        com.apple.security.application-groups:
          - group.live.firstlight.rituals
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: RitualsComplications
        embed: true
  RitualsComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RitualsComplications
      - path: Shared
    info:
      path: RitualsComplications/Info.plist
      properties:
        CFBundleDisplayName: FL Rituals
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RitualsComplications/RitualsComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.live.firstlight.rituals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.firstlight.rituals.complications
