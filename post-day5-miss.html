<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 Miss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 1080px;
            background: #0A0C10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
            text-align: center;
            position: relative;
            background: linear-gradient(135deg, #0A0C10 0%, #1a1d2e 100%);
        }
        .film-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' seed='2' /%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .label {
            color: #FF5252;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .number {
            color: #FF5252;
            font-size: 180px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 30px;
            text-shadow: 0 0 40px rgba(255, 82, 82, 0.3);
        }
        .currency {
            color: #00D4FF;
            font-size: 64px;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }
        .message {
            color: #ffffff;
            font-size: 24px;
            line-height: 1.6;
            max-width: 800px;
            margin-bottom: 80px;
            letter-spacing: 1px;
        }
        .cta {
            color: #00D4FF;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 40px;
        }
        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FF5252, transparent);
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <div class="film-grain"></div>
    <div class="container">
        <div class="content">
            <div class="label">DAY 5 MISS</div>
            <div class="number">15000</div>
            <div class="divider"></div>
            <div class="currency">₹</div>
            <div class="message">
                The system has teeth.<br>
                It will hurt. It's supposed to.
            </div>
            <div class="cta">firstlight.live</div>
        </div>
    </div>
</body>
</html>
